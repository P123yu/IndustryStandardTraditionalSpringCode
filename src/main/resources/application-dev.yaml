server:
  port: ${DEV_SERVER_PORT}
  servlet:
    context-path: ${DEV_CONTEXT_PATH}

spring:
  application:
    name: ReviseSpringBasics

  datasource:
    url: jdbc:postgresql://${DEV_DB_URL}/${DEV_DB_NAME}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    format:
      date: dd-MM-yyyy
      date-time: dd-MM-yyyy HH:mm:ss
      time: HH:mm:ss

  jackson:
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /revise/student/swagger-ui.html


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
